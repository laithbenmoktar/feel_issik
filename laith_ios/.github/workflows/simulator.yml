name: Simulator build + screenshots
on:
  workflow_dispatch:

jobs:
  sim:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: brew install xcodegen

      - name: GoogleService-Info.plist
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 --decode > Laith/GoogleService-Info.plist

      - run: xcodegen generate

      - name: Compiler pour le simulateur
        run: |
          xcodebuild -project Laith.xcodeproj -scheme Laith \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Lancer, capturer, filmer
        run: |
          mkdir out
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=build/Build/Products/Debug-iphonesimulator/Laith.app
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl io "$UDID" recordVideo out/demo.mp4 &
          REC=$!
          xcrun simctl launch "$UDID" isetb.tp1.laith
          sleep 10
          xcrun simctl io "$UDID" screenshot out/01-login.png
          sleep 5
          kill -INT $REC; sleep 2
          cp -R "$APP" out/
          (cd out && zip -qr Laith-simulator.zip Laith.app && rm -rf Laith.app)

      - uses: actions/upload-artifact@v4
        with:
          name: simulator-output
          path: out/
