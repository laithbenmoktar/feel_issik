name: Build iOS App
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: GoogleService-Info.plist
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$PLIST" ]; then
            echo "$PLIST" | base64 --decode > Laith/GoogleService-Info.plist
          fi
          ls -la Laith/GoogleService-Info.plist || echo "ATTENTION: plist absent"

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iOS App
        run: |
          set -o pipefail
          xcodebuild -project Laith.xcodeproj -scheme Laith \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)"

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Laith.app Payload/
          zip -qr Laith.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Laith-ipa
          path: Laith.ipa

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
