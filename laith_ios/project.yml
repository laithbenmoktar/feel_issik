name: Laith
options:
  bundleIdPrefix: isetb.tp1
  deploymentTarget:
    iOS: "16.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
targets:
  Laith:
    type: application
    platform: iOS
    sources:
      - path: Laith
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: isetb.tp1.laith
        MARKETING_VERSION: "1.7"
        CURRENT_PROJECT_VERSION: "5"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "FEEL ISSIK"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Choisir une photo de profil, d'affiche ou à partager dans le salon."
        INFOPLIST_KEY_NSCameraUsageDescription: "Prendre une photo à partager dans le salon."
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
  LaithTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LaithTests
    dependencies:
      - target: Laith
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Laith.app/Laith"
        BUNDLE_LOADER: "$(TEST_HOST)"
