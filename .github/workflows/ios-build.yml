name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: |
        cd laith_ios
        xcodegen generate

    - name: Build iOS App
      run: |
        cd laith_ios
        # Détection automatique du nom du scheme
        SCHEME=$(xcodebuild -list -project *.xcodeproj | grep -A 10 "Schemes:" | tail -n +2 | xargs | awk '{print $1}')
        echo "Building scheme: $SCHEME"
        xcodebuild -project *.xcodeproj \
                   -scheme "$SCHEME" \
                   -sdk iphoneos \
                   -configuration Release \
                   CODE_SIGNING_ALLOWED=NO \
                   BUILD_DIR=build

    - name: Package IPA
      run: |
        mkdir -p laith_ios/build/Payload
        mv laith_ios/build/Release-iphoneos/*.app laith_ios/build/Payload/
        cd laith_ios/build && zip -r feel_issik.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-ipa
        path: laith_ios/build/feel_issik.ipa
